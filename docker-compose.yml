services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      AUTH0_BASE_URL: ${AUTH0_BASE_URL:-http://localhost:3000}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_COOKIE_SECRET: ${AUTH0_COOKIE_SECRET:-}
      AUTH0_AD_CONNECTION: ${AUTH0_AD_CONNECTION:-}
      AUTH0_NON_AD_CONNECTION: ${AUTH0_NON_AD_CONNECTION:-}
    ports:
      - "3000:3000"
    command: php -S 0.0.0.0:3000 -t /var/www/html /var/www/html/index.php

volumes:
  vendor:
